name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing here publishes, pushes or comments, and a
# pull request from a fork runs with this same token - so the narrower it is,
# the less a hostile PR can reach. Raise it per job if that ever changes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The badge on the README used to report a build with no tests behind it,
      # which is the specific failure a badge exists to prevent.
      - name: Unit tests
        run: node scripts/run-tests.mjs

  # The image is how a directory builds and runs this server. A broken COPY turns
  # nothing red on its own: it fails on their side, and Glama withholds
  # distribution entirely when a build fails, so the symptom is silence rather
  # than an error. Build it here, and prove the container still answers with no
  # credentials at all.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t m00n-mcp:ci .

      - name: It answers introspection with no credentials
        run: |
          set -uo pipefail
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            sleep 5
          } | docker run -i --rm m00n-mcp:ci > out.jsonl || true

          # Counting tool names rather than parsing: the point is that a real
          # listing came back, and an empty or absent one must not read as a pass.
          COUNT=$(grep -o '"name":"[a-z_]*"' out.jsonl | wc -l)
          echo "tool names seen: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::The container did not list its tools when started unconfigured."
            cat out.jsonl
            exit 1
          fi
